<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 前额叶训练场：深色底 + 3×3 注意格。中心是「当前」，左上是「N 步前」。 -->
  <rect width="1024" height="1024" fill="#0d1220"/>
  <g fill="#1a2740">
    <rect x="214" y="214" width="180" height="180" rx="36"/>
    <rect x="422" y="214" width="180" height="180" rx="36"/>
    <rect x="630" y="214" width="180" height="180" rx="36"/>
    <rect x="214" y="422" width="180" height="180" rx="36"/>
    <rect x="422" y="422" width="180" height="180" rx="36"/>
    <rect x="630" y="422" width="180" height="180" rx="36"/>
    <rect x="214" y="630" width="180" height="180" rx="36"/>
    <rect x="422" y="630" width="180" height="180" rx="36"/>
    <rect x="630" y="630" width="180" height="180" rx="36"/>
  </g>
  <rect x="214" y="214" width="180" height="180" rx="36" fill="#5d9bff"/>
  <rect x="422" y="422" width="180" height="180" rx="36" fill="#ffd75d"/>
</svg>
